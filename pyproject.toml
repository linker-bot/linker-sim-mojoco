[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "linker-sim"
version = "1.0.0"
description = "The Linker LW-v0 workstation on the CPU, with MuJoCo"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{name = "Ryan Zhou"}]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "src/linker_sim/NOTICE", "policy-gallery/ycb-grasp/NOTICE"]
# Exact pins for everything that decides how LW-v0 behaves or is shown; see
# src/linker_sim/engine.py for why each is pinned.
dependencies = [
    "mujoco==4.0.1",
    "warp-lang==1.17.0",
    "torch==2.11.0",
    "viser==1.1.1",
    "mjviser==0.0.17",
    "numpy>=2",
    "packaging>=24",
    "pyyaml>=6",
    "scipy>=1.11",  # trimesh's convex hulls (objects.mass_properties)
    "trimesh>=4",
    # LW-v0's robot files (data only), from linker-sim-assets at a release tag
    # (linker_sim.assets).
    "linker-lw-v0 @ git+https://github.com/linker-bot/linker-sim-assets@v1.0.0",
]

[project.scripts]
linker-sim = "linker_sim.cli:main"

[dependency-groups]
dev = [
    # The viewer tests: screenshots, and Chrome's DevTools protocol (tests/browser.py).
    "pillow>=10",
    "pytest>=8.3,<10",
    # The arm generator's reference (tests/test_arm.py), the version linker-lab tests with.
    # No Linux ARM64 wheel: those tests skip there rather than compile it from source.
    "ruckig==0.19.4; platform_machine != 'aarch64'",
    "ruff>=0.11,<1",
    "websockets>=13",
]

[tool.uv]
# Apple Silicon Macs and Linux on x86_64 or ARM; no GPU needed. MuJoCo 4.0.1 and Warp
# publish no wheels for Intel Macs; Windows is not supported yet.
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

# PyPI's Linux torch wheels bring the CUDA libraries (several GB); the CPU index has
# CPU-only wheels for every supported platform.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.hatch.metadata]
allow-direct-references = true  # linker-lw-v0 from git

[tool.hatch.build.targets.wheel]
packages = ["src/linker_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
